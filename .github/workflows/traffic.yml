name: Record traffic

on:
  schedule:
    - cron: "0 13 * * *"    # 每天东京时间 22:00（UTC 13:00）运行一次
  workflow_dispatch:        # 也可以在 Actions 页面手动运行

permissions:
  contents: write

concurrency:
  group: traffic
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and merge traffic data
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::未设置 TRAFFIC_TOKEN secret"
            exit 1
          fi
          mkdir -p traffic

          # views / clones：按日期合并，新数据覆盖同一天的旧数据
          for kind in views clones; do
            gh api "repos/${REPO}/traffic/${kind}?per=day" > "/tmp/${kind}.json"
            file="traffic/${kind}.json"
            [ -f "$file" ] || echo '[]' > "$file"
            jq -s --arg k "$kind" '
              (.[0] + .[1][$k])
              | group_by(.timestamp)
              | map(.[-1])
              | sort_by(.timestamp)
            ' "$file" "/tmp/${kind}.json" > "/tmp/${kind}.merged.json"
            mv "/tmp/${kind}.merged.json" "$file"
          done

          # 来源网站和热门页面只有最近 14 天的汇总，按日期存快照
          today=$(date -u +%F)
          mkdir -p traffic/snapshots
          jq -n \
            --argjson referrers "$(gh api "repos/${REPO}/traffic/popular/referrers")" \
            --argjson paths "$(gh api "repos/${REPO}/traffic/popular/paths")" \
            '{referrers: $referrers, paths: $paths}' \
            > "traffic/snapshots/${today}.json"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add traffic
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "chore: record traffic $(date -u +%F)"
            git push
          fi
